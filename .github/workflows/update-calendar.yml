
name: Update US Policy Calendar

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'manual_events.json'
      - 'policy_calendar.py'
      - 'test_policy_calendar.py'
      - 'futu_calendar.py'
      - 'futu_integration.py'
      - 'test_futu_calendar.py'
      - 'test_futu_integration.py'
      - 'requirements.txt'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: write

concurrency:
  group: us-policy-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Futu signing dependency when enabled
        if: vars.FUTU_PUBLISH_ENABLED == 'true'
        continue-on-error: true
        run: python -m pip install cryptography==50.0.2

      - name: Test calendar
        run: python -m unittest -v

      - name: Generate calendar
        id: generate
        env:
          FUTU_PUBLISH_ENABLED: ${{ vars.FUTU_PUBLISH_ENABLED }}
          FUTU_APP_KEY: ${{ secrets.FUTU_APP_KEY }}
          FUTU_PRIVATE_KEY: ${{ secrets.FUTU_PRIVATE_KEY }}
        run: |
          set +e
          python policy_calendar.py
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          echo "partial=$code" >> "$GITHUB_OUTPUT"

      - name: Publish calendar
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add us-policy.ics source_cache.json source_status.json
          if git diff --cached --quiet; then
            echo 'No calendar changes.'
            exit 0
          fi
          git commit -m 'Update US policy calendar'
          git push origin main

      - name: Report source errors
        if: steps.generate.outputs.partial == '2'
        run: |
          echo 'One or more sources failed. Valid updates published; previous snapshots retained.'
          exit 1
